<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabus — NEU C64</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --berkeley-blue: #003262;
      --text-primary: #1a1a1a; --text-secondary: #555; --text-tertiary: #999;
      --border: #e5e5e5; --bg: #fff; --bg-secondary: #f8f8f8;
      --radius-md: 8px; --radius-lg: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; color: var(--text-primary); background: var(--bg); min-height: 100vh; font-size: 16px; line-height: 1.6; display: flex; flex-direction: column; }
    a { text-decoration: none; color: inherit; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); z-index: 100; flex-shrink: 0; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--berkeley-blue); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-mark svg { width: 20px; height: 20px; }
    .logo-text { font-size: 17px; font-weight: 500; line-height: 1.2; }
    .logo-sub { font-size: 12px; color: var(--text-secondary); }
    nav ul { list-style: none; display: flex; gap: 0.25rem; }
    nav ul li a { font-size: 13px; color: var(--text-secondary); padding: 6px 14px; border-radius: var(--radius-md); transition: background 0.15s, color 0.15s; }
    nav ul li a:hover { background: var(--bg-secondary); color: var(--text-primary); }
    nav ul li a.active { background: var(--bg-secondary); color: var(--text-primary); }

    .page-header { padding: 2.5rem 2rem 1.5rem; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .header-left {}
    .breadcrumb { font-size: 13px; color: var(--text-tertiary); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 6px; }
    .breadcrumb a { color: var(--text-tertiary); }
    .breadcrumb a:hover { color: var(--text-primary); }
    .breadcrumb svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 34px; font-weight: 400; }

    .download-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 18px; background: var(--berkeley-blue); color: white;
      border-radius: var(--radius-md); font-size: 13px; font-weight: 500;
      transition: opacity 0.15s; flex-shrink: 0;
    }
    .download-btn:hover { opacity: 0.88; }
    .download-btn svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .pdf-wrap {
      flex: 1;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .pdf-embed {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 600px;
    }

    .pdf-embed iframe {
      width: 100%;
      height: 100%;
      min-height: 780px;
      display: block;
      border: none;
    }

    footer { border-top: 1px solid var(--border); padding: 1.25rem 2rem; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-tertiary); flex-shrink: 0; }

    @media (max-width: 600px) {
      nav ul { display: none; }
      .page-header { padding: 1.5rem 1.25rem; }
      .pdf-wrap { padding: 1rem 1.25rem; }
      footer { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html" class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="3" fill="#FDB515"/>
          <path d="M10 3C10 3 14.5 6 14.5 10C14.5 14 10 17 10 17C10 17 5.5 14 5.5 10C5.5 6 10 3 10 3Z" stroke="#FDB515" stroke-width="1.25" fill="none"/>
          <path d="M3 10C3 10 6 6 10 6C14 6 17 10 17 10C17 10 14 14 10 14C6 14 3 10 3 10Z" stroke="white" stroke-width="1.25" fill="none" opacity="0.55"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">NEU C64</div>
        <div class="logo-sub">Summer 2026</div>
      </div>
    </a>
    <ul>
      <li><a href="index.html" class="active">Syllabus</a></li>
      <li><a href="../staff/index.html">Teaching staff</a></li>
      <li><a href="../tools/index.html">Tools</a></li>
      <li><a href="#">Resources</a></li>
      <li><a href="../feedback/index.html">Feedback</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <div class="header-left">
      <div class="breadcrumb">
        <a href="../index.html">NEU C64</a>
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        Syllabus
      </div>
      <h1>Syllabus</h1>
    </div>
    <a href="NeuC64_SU26_Syllabus.pdf" download class="download-btn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </a>
  </div>

  <div class="pdf-wrap">
    <div class="pdf-embed">
      <iframe src="NeuC64_SU26_Syllabus.pdf" title="NEU C64 Syllabus"></iframe>
    </div>
  </div>

  <footer>
    <span>Tara Raam, Ph.D. · UC Berkeley Neuroscience</span>
    <span>tararaam.github.io/neu-c64</span>
  </footer>

</body>
</html>
